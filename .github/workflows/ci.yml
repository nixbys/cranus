name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.16.3
      - run: ruff check src tests

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cranus
          POSTGRES_PASSWORD: cranus
          POSTGRES_DB: cranus
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cranus -d cranus"
          --health-interval 5s --health-timeout 5s --health-retries 10
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/cranus-dev-password
        ports: ["7687:7687", "7474:7474"]
        options: >-
          --health-cmd "wget -q --spider http://localhost:7474 || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr poppler-utils
      - name: Install package
        run: pip install -e ".[dev]" && python -m spacy download en_core_web_sm
      - name: Run migrations
        env:
          POSTGRES_HOST: localhost
          POSTGRES_USER: cranus
          POSTGRES_PASSWORD: cranus
          POSTGRES_DB: cranus
        run: alembic upgrade head
      - name: Run tests
        env:
          POSTGRES_HOST: localhost
          POSTGRES_USER: cranus
          POSTGRES_PASSWORD: cranus
          POSTGRES_DB: cranus
          NEO4J_URI: bolt://localhost:7687
          NEO4J_PASSWORD: cranus-dev-password
          API_KEY_PEPPER: ci-test-pepper-not-for-production
        run: pytest tests/unit tests/integration -v

  docker-build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: Build api image
        run: docker build -f docker/Dockerfile.api -t cranus-api:ci .
      - name: Build worker image
        run: docker build -f docker/Dockerfile.worker -t cranus-worker:ci .
